server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /api/* 요청은 백엔드 컨테이너(서비스명 server)로 그대로 전달한다.
    # 프론트와 API가 같은 출처(origin)로 보이게 되어, 네이버 로그인 state 쿠키가
    # 문제없이 오가고 별도 CORS 설정도 필요 없다.
    location /api/ {
        proxy_pass http://server:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router(client-side routing) 새로고침 대응: 없는 경로는 index.html로 넘겨서
    # 프론트 라우터가 처리하게 한다.
    location / {
        try_files $uri /index.html;
    }
}
